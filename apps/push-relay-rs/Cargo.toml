[package]
name = "push-relay"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
deadpool-postgres = "0.14.2"
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-graceful", "http1"] }
p256 = { version = "0.14.0", features = ["ecdsa", "pkcs8", "pem"] }
percent-encoding = "2.3.2"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
sha2 = "0.11.0"
subtle = "2.6.1"
tokio = { version = "1.53.2", default-features = false, features = ["rt", "macros", "net", "time", "signal", "sync"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-serde_json-1"] }
url = "2.5.8"
uuid = { version = "1.27.0", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
