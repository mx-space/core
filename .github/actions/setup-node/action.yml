name: 'Setup Node.js and pnpm'
description: 'Sets up Node.js and pnpm with caching'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '22.x'

runs:
  using: 'composite'
  steps:
    - name: Use Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup pnpm
      # v6.1.0 is the first release with pnpm 12 support (native binary
      # bootstrap); the floating `v6` tag still points at v6.0.10.
      uses: pnpm/action-setup@v6.1.0
      with:
        run_install: true
        cache: true
      env:
        REDISMS_DISABLE_POSTINSTALL: 1
