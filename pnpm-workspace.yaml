packages:
  - packages/*
  - apps/*
allowBuilds:
  "@code-inspector/core": false
  "@google/genai": false
  "@nestjs/core": true
  "@parcel/watcher": false
  "@swc/core": true
  cpu-features: false
  esbuild: true
  mongodb-memory-server: true
  msgpackr-extract: false
  node-pty: true
  protobufjs: false
  redis-memory-server: true
  sharp: true
  simple-git-hooks: true
  ssh2: false
  unrs-resolver: true
  workerd: true
overrides:
  "eslint-plugin-react-compiler>zod": 3.25.76
  "get-pixels@^3>request": ./external/request
  # better-auth 1.7 keys accounts on (issuer, accountId) and needs a schema
  # migration; hold the 1.6 line until that lands.
  better-auth: 1.6.27
  "@better-auth/api-key": 1.6.27
  "@better-auth/core": 1.6.27
  "@better-auth/expo": 1.6.27
  "@better-auth/passkey": 1.6.27
  kysely: 0.29.5
  mongodb: ~7.5.0
  pino: ./external/pino
  rolldown: 1.2.5
  "tsdown@0.22.8>rolldown-plugin-dts": 0.27.9
  semver: 7.8.5
  typescript: 6.0.3
  undici: ^8.10.0
  whatwg-url: 17.1.0
  zod: 4.4.3
  "lodash-es@<4.18.0": 4.18.1
  "nanoid@<3.3.8": 5.1.16
  "nanoid@>=4.0.0 <5.0.9": 5.1.16
  "tmp@<0.2.6": 0.2.7
  "uuid@<11.1.1": 11.1.1
  lucide-react: 1.33.0
  "@codemirror/state": 6.7.1
  "@codemirror/view": 6.43.9
  "@codemirror/commands": 6.11.0
  "@codemirror/language": 6.12.4
  # @haklex/rich-ext-chat -> @streamdown/code hard-deps shiki@^3.x while
  # @haklex/rich-editor peers shiki>=4.0.0; force one runtime copy.
  shiki: ^4.4.3
  # Editor stack tracks a single lexical runtime copy; keep in lockstep with
  # the @haklex/* peer floor (^0.49 as of @haklex 0.33.0).
  lexical: 0.49.0
  "@lexical/a11y": 0.49.0
  "@lexical/clipboard": 0.49.0
  "@lexical/code-core": 0.49.0
  "@lexical/devtools-core": 0.49.0
  "@lexical/dragon": 0.49.0
  "@lexical/extension": 0.49.0
  "@lexical/hashtag": 0.49.0
  "@lexical/headless": 0.49.0
  "@lexical/history": 0.49.0
  "@lexical/html": 0.49.0
  "@lexical/internal": 0.49.0
  "@lexical/link": 0.49.0
  "@lexical/list": 0.49.0
  "@lexical/mark": 0.49.0
  "@lexical/markdown": 0.49.0
  "@lexical/overflow": 0.49.0
  "@lexical/plain-text": 0.49.0
  "@lexical/react": 0.49.0
  "@lexical/rich-text": 0.49.0
  "@lexical/selection": 0.49.0
  "@lexical/table": 0.49.0
  "@lexical/text": 0.49.0
  "@lexical/utils": 0.49.0
  "@lexical/yjs": 0.49.0
  "@esbuild-kit/core-utils>esbuild": 0.25.12
  "@fastify/static": 10.1.3
  "brace-expansion@<1.1.16": 1.1.18
  "brace-expansion@>=2.0.0 <2.1.2": 2.1.4
  "brace-expansion@>=3.0.0 <5.0.8": 5.0.9
  dompurify: 3.4.14
  "fast-uri@>=3.0.0 <3.1.4": 3.1.5
  "fast-uri@>=4.0.0 <4.1.1": 4.1.2
  fast-xml-parser: 5.11.0
  find-my-way: 9.8.0
  immutable: 4.3.9
  "isomorphic-fetch>node-fetch": 2.7.0
  "js-yaml@>=4.0.0 <4.3.0": 4.3.1
  "js-yaml@>=5.0.0 <5.3.0": 5.3.0
  "postcss@<8.5.18": 8.5.24
  "protobufjs@>=7.5.0 <7.6.5": 7.6.5
  sharp: 0.35.3
  "tar@<=7.5.17": 7.5.22
publicHoistPattern:
  - "*fastify*"
  - mongodb
  - "*eslint*"
  - "*webpack*"
  - "*@codemirror*"
strictPeerDependencies: false
minimumReleaseAgeExclude:
  - "@haklex/*"
  - "@mx-space/*"
  - "@babel/*"
  - '@cloudflare/workers-types@4.20260611.1 || 5.20260715.1'
  - "@code-inspector/core@1.5.4"
  - "@code-inspector/esbuild@1.5.4"
  - "@code-inspector/mako@1.5.4"
  - "@code-inspector/turbopack@1.5.4"
  - "@code-inspector/vite@1.5.4"
  - "@code-inspector/webpack@1.5.4"
  - "@nestjs/cache-manager@3.1.3"
  - "@pierre/theming@0.0.1"
  - "@types/node@25.9.3"
  - "@types/nodemailer@8.0.1"
  - code-inspector-plugin@1.5.4
  - jotai@2.20.1 || 2.20.2
  - nodemailer@8.0.11
  - "@innei/react-tweet@3.4.3"
  - react-router@8.0.0
  - '@codemirror/lang-markdown@6.5.1'
  - '@earendil-works/pi-ai@0.80.7 || 0.82.0 || 0.83.0'
  - '@earendil-works/pi-ai@0.84.1'
  - '@earendil-works/pi-agent-core@0.83.0'
  - '@earendil-works/pi-agent-core@0.84.1'
  - '@innei/message-engine@0.2.0'
  - '@rolldown/binding-android-arm64@1.2.0'
  - '@rolldown/binding-darwin-arm64@1.2.0'
  - '@rolldown/binding-darwin-x64@1.2.0'
  - '@rolldown/binding-freebsd-x64@1.2.0'
  - '@rolldown/binding-linux-arm-gnueabihf@1.2.0'
  - '@rolldown/binding-linux-arm64-gnu@1.2.0'
  - '@rolldown/binding-linux-arm64-musl@1.2.0'
  - '@rolldown/binding-linux-ppc64-gnu@1.2.0'
  - '@rolldown/binding-linux-s390x-gnu@1.2.0'
  - '@rolldown/binding-linux-x64-gnu@1.2.0'
  - '@rolldown/binding-linux-x64-musl@1.2.0'
  - '@rolldown/binding-openharmony-arm64@1.2.0'
  - '@rolldown/binding-wasm32-wasi@1.2.0'
  - '@rolldown/binding-win32-arm64-msvc@1.2.0'
  - '@rolldown/binding-win32-x64-msvc@1.2.0'
  - miniflare@4.20260710.0
  - rolldown@1.2.0
  - tsdown@0.22.8
  - wrangler@4.111.0
  - zod-compiler@1.26.0
